<title>GlassDrop</title>
<style>
:root{
  --bg:#040405; --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.075); --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --txt:#f4f4f6; --mut:rgba(244,244,246,.55); --dim:rgba(244,244,246,.32);
  --r:22px; --font:"Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;opacity:.55;animation:float 18s ease-in-out infinite alternate}
.orb.a{width:520px;height:520px;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);top:-180px;left:-120px}

// Partikel-Hintergrund mit Glow + Verbindungslinien
(function () {
  const c = document.getElementById('fx'); if (!c) return;
  const x = c.getContext('2d');
  let W, H, P = [], DPR = Math.min(window.devicePixelRatio || 1, 2);
  const mouse = { x: -999, y: -999 };
  function size() {
    W = innerWidth; H = innerHeight; c.width = W * DPR; c.height = H * DPR; c.style.width = W + 'px'; c.style.height = H + 'px';
    x.setTransform(DPR, 0, 0, DPR, 0, 0);
    const n = Math.round(Math.min(110, W * H / 11000));
    P = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25 - .05, r: Math.random() * 1.6 + .3, a: Math.random() * .6 + .2, t: Math.random() * 6.28 }));
  }
  addEventListener('resize', size); size();
  addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  function loop() {
    x.clearRect(0, 0, W, H);
    for (const p of P) {
      p.t += .02; p.x += p.vx; p.y += p.vy;
      const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
      if (d < 120) { p.x += dx / d * .8; p.y += dy / d * .8; }
      if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10; if (p.y < -10) p.y = H + 10; if (p.y > H + 10) p.y = -10;
      const al = p.a * (.6 + .4 * Math.sin(p.t));
      x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.283);
      x.fillStyle = `rgba(255,255,255,${al})`; x.shadowColor = 'rgba(255,255,255,.9)'; x.shadowBlur = 8 * p.r; x.fill();
    }
    x.shadowBlur = 0;
    for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
      const a = P[i], b = P[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 110) { x.strokeStyle = `rgba(255,255,255,${(1 - d / 110) * .09})`; x.lineWidth = .6; x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke(); }
    }
    requestAnimationFrame(loop);
  }
  loop();

    ${canShare ? `<button class="btn primary" style="height:40px;padding:0 16px;border-radius:13px" onclick="saveAll(${di})">Alle sichern</button>` : ''}</div>
    <div class="rlist">${d.files.map((f, i) => `<div class="ri"><div class="thumb">${
      f.k === 'image' ? `<img src="${f.url}">` : f.k === 'video' ? `<video muted playsinline preload="metadata" src="${f.url}#t=0.3"></video>` : `<span class="ext">${esc(ext(f.name))}</span>`
    }</div><div class="nm"><div>${esc(f.name)}</div><div>${fmt(f.size)}</div></div>
    <button class="dl" onclick="saveOne(${di},${i},this)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0l-5-5m5 5l5-5M5 20h14"/></svg></button></div>`).join('')}</div></div>`).join('');
}
function done(btn) { btn.classList.add('ok'); btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'; }
async function share(list) {
  const fl = list.map(f => new File([f.blob], f.name, { type: f.type || f.blob.type }));
  if (navigator.canShare && navigator.canShare({ files: fl })) { await navigator.share({ files: fl }); return true; }
  return false;
}
async function saveOne(di, i, btn) {
  const f = received[di].files[i];
  try { if (await share([f])) return done(btn); } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = f.url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); done(btn);
}
async function saveAll(di) { try { await share(received[di].files); } catch {} }

$('#me').onclick = () => { $('#fname').value = myName; $('#fcode').value = code; sheet('setsheet', true); };
$('#setno').onclick = () => sheet('setsheet', false);
$('#sbg').onclick = () => { sheet('setsheet', false); };
$('#setyes').onclick = () => {
  myName = ($('#fname').value.trim() || defName).slice(0, 30); LS.s('gd-name', myName); $('#myname').textContent = myName; net.setName(myName);
  const c = $('#fcode').value.trim().toUpperCase(); if (c !== code) { code = c; LS.s('gd-code', code); net.setCode(code); }
  sheet('setsheet', false);
};

function toast(t) { $('#inappt').textContent = t; $('#inapp').classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => $('#inapp').classList.remove('on'), 3000); }
$('#inapp').onclick = () => go('recv');
chips(); render(); renderDevs(); renderRecv();
</script>
